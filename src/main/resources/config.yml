# The default number of clusters for entity analysis.
default-cluster-count: 5

debug-mode: false

cluster-item-material: COMPASS

# 粒子效果配置
particle:
  enabled: true        # 是否启用粒子效果
  count: 1            # 粒子数量
  refresh-rate: 5       # 粒子刷新频率 (单位: ticks)
  duration: 600        # 粒子效果持续时间 (单位: ticks, 30秒)

# 发光效果配置
glowing:
  enabled: true        # 是否启用发光效果
  duration: 200        # 发光效果持续时间 (单位: ticks, 10秒)

# Language Setting (zh_CN, en_US)
language: en_US