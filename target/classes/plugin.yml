name: EntityAnalyzer
version: 1.0
main: cn.panda.entityanalyzer.EntityAnalyzerPlugin
api-version: 1.12
commands:
  analyzeentities:
    description: 对世界中的实体进行聚类分析，找出潜在的性能瓶颈区域。
    usage: /analyzeentities [聚类数量]
    permission: entityanalyzer.analyze
    permission-message: 你没有权限使用此命令。
permissions:
  entityanalyzer.analyze:
    description: 允许使用实体分析命令
    default: op